server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: billing-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForHMACSHA256AlgorithmThatMustBeAtLeast256BitsLong}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

  reminder:
    enabled: ${REMINDER_ENABLED:true}
    cron: "0 0 8 * * *"   # Daily at 8 AM

  storage:
    type: ${STORAGE_TYPE:local}   # local | s3
    local-path: ${STORAGE_PATH:./storage}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
